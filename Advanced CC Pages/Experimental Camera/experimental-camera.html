<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="text-scale" content="scale">
    <link rel="preload" href="../../RES/BradleyHandITCTT-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <title>Experimental Camera - Advanced CC</title>
    <link rel="stylesheet" href="experimental-camera.css">
    <script src="../../loading-particle.js"></script>
    <script type="speculationrules">
    {
      "prefetch": [{
        "where": {
          "and": [
            { "href_matches": "/*" },
            { "not": { "selector_matches": "[target=_blank]" } }
          ]
        },
        "eagerness": "moderate"
      }]
    }
    </script>
</head>
<body>
    <main>
        <a class="back" href="../advanced-cc.html">← Back</a>
        <h1>III. Experimental <u>Camera</u></h1>
        <p class="intro">Design and create an experimental camera with a specific purpose or usage in mind.</p>

        <div class="content">
            <p class="placeholder">Retro Soviet EL surveillance interface with hand-tracked interaction.</p>
            <a class="launch-btn" href="project/index.html">Open Project Fullscreen</a>
        </div>
    </main>
    <script>
        (() => {
            const root = document.documentElement;
            const loadImage = src => new Promise(resolve => {
                const image = new Image();
                image.onload = resolve;
                image.onerror = resolve;
                image.src = src;
                if (image.complete) resolve();
            });
            const imageSources = Array.from(document.querySelectorAll("img[data-src]")).map(image => image.dataset.src).filter(Boolean);
            const fontReady = document.fonts ? document.fonts.ready.catch(() => {}) : Promise.resolve();
            const pageReady = document.readyState === "complete" ? Promise.resolve() : new Promise(resolve => window.addEventListener("load", resolve, { once: true }));
            const minimumHold = new Promise(resolve => setTimeout(resolve, 1200));
            const maxHold = new Promise(resolve => setTimeout(resolve, 4200));
            const ready = Promise.all([...imageSources.map(loadImage), fontReady, pageReady, minimumHold]);

            Promise.race([ready, maxHold]).then(() => {
                document.querySelectorAll("[data-src]").forEach(node => {
                    node.src = node.dataset.src;
                });
                requestAnimationFrame(() => {
                    if (window.finishLoadingScreen) {
                        window.finishLoadingScreen();
                    } else {
                        root.classList.remove("is-loading");
                        root.classList.add("is-ready");
                    }
                });
            });
        })();
    </script>
</body>
</html>
